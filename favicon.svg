/* =========================================================
   Portfólio – Renato Moura
   Tema escuro azul-marinho com detalhes em azul.
   Para mudar as cores, edite as variáveis em :root.
   ========================================================= */

:root {
  --bg: #0a0f1e;
  --bg-alt: #0d1426;
  --surface: #111a30;
  --surface-2: #16213d;
  --border: #1f2d4d;
  --text: #e6ebf5;
  --muted: #94a3c4;
  --accent: #3b82f6;
  --accent-2: #60a5fa;
  --accent-soft: rgba(59, 130, 246, 0.12);
  --radius: 14px;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --header-h: 68px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: var(--header-h); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; margin: 0; padding: 0; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
p { margin: 0 0 1rem; }

.container { width: min(1120px, 92%); margin-inline: auto; }
.muted { color: var(--muted); }
.small { font-size: 0.9rem; }
.gradient-text {
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; border-radius: 6px; }

/* ---------- Header ---------- */
.header {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  height: var(--header-h);
  background: rgba(10, 15, 30, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color .3s, background .3s;
}
.header.scrolled { border-bottom-color: var(--border); background: rgba(10, 15, 30, 0.9); }
.nav { height: 100%; display: flex; align-items: center; justify-content: space-between; }
.logo { font-family: var(--mono); font-weight: 500; font-size: 1.15rem; }
.logo-bracket { color: var(--accent); }
.nav-menu { display: flex; align-items: center; gap: 1.6rem; }
.nav-link { font-size: .93rem; color: var(--muted); transition: color .2s; position: relative; }
.nav-link:hover, .nav-link.active { color: var(--text); }
.nav-link.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 2px;
  background: var(--accent); border-radius: 2px;
}
.nav-cta {
  color: var(--text); padding: .45rem 1rem; border: 1px solid var(--accent);
  border-radius: 999px; transition: background .2s;
}
.nav-cta:hover { background: var(--accent-soft); }
.nav-cta.active::after { display: none; }
.nav-toggle { display: none; background: none; border: 0; padding: 8px; cursor: pointer; }
.nav-toggle span { display: block; width: 24px; height: 2px; background: var(--text); margin: 5px 0; transition: transform .3s, opacity .3s; }
.nav-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ---------- Botões ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  padding: .85rem 1.5rem; border-radius: 10px; font-weight: 600; font-size: .97rem;
  border: 1px solid transparent; cursor: pointer;
  transition: transform .2s, background .2s, border-color .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 6px 22px rgba(59, 130, 246, .35); }
.btn-primary:hover { background: #2f74eb; }
.btn-ghost { border-color: var(--border); color: var(--text); background: transparent; }
.btn-ghost:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn-small { padding: .55rem 1.05rem; font-size: .88rem; border-radius: 8px; }
.btn.is-pending { opacity: .55; cursor: not-allowed; box-shadow: none; }
.btn.is-pending:hover { transform: none; }

/* ---------- Hero ---------- */
.hero { position: relative; min-height: 100vh; display: flex; align-items: center; padding: calc(var(--header-h) + 2rem) 0 4rem; overflow: hidden; }
.hero-glow {
  position: absolute; width: 620px; height: 620px; right: -160px; top: 8%;
  background: radial-gradient(circle, rgba(59,130,246,.28), transparent 65%);
  filter: blur(40px); pointer-events: none;
}
.hero-grid { position: relative; display: grid; grid-template-columns: 1.15fr .85fr; gap: 3.5rem; align-items: center; }
.eyebrow {
  display: inline-flex; align-items: center; gap: .6rem; font-size: .85rem; color: var(--accent-2);
  background: var(--accent-soft); border: 1px solid rgba(59,130,246,.3);
  padding: .35rem .9rem; border-radius: 999px; margin-bottom: 1.4rem;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(52,211,153,0); } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); } }
.hero h1 { font-size: clamp(2.2rem, 5.5vw, 3.7rem); letter-spacing: -.02em; margin-bottom: .8rem; }
.hero-role { font-family: var(--mono); font-size: clamp(.95rem, 2vw, 1.15rem); color: var(--accent-2); margin-bottom: 1.3rem; }
.cursor { animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero-text { color: var(--muted); max-width: 560px; font-size: 1.05rem; margin-bottom: 2rem; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .9rem; margin-bottom: 2rem; }
.social-row { display: flex; flex-wrap: wrap; gap: .7rem; }
.social-btn {
  font-size: .88rem; color: var(--muted); padding: .4rem .95rem;
  border: 1px solid var(--border); border-radius: 8px; transition: color .2s, border-color .2s, background .2s;
}
.social-btn:hover { color: var(--text); border-color: var(--accent); background: var(--accent-soft); }

.code-window { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; animation: float 6s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-10px); } }
.code-bar { display: flex; align-items: center; gap: 7px; padding: .75rem 1rem; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.code-bar span { width: 11px; height: 11px; border-radius: 50%; background: #334363; }
.code-bar span:nth-child(1) { background: #ff5f57; } .code-bar span:nth-child(2) { background: #febc2e; } .code-bar span:nth-child(3) { background: #28c840; }
.code-bar em { margin-left: auto; font-style: normal; font-family: var(--mono); font-size: .78rem; color: var(--muted); }
.code-window pre { margin: 0; padding: 1.3rem 1.4rem; overflow-x: auto; }
.code-window code { font-family: var(--mono); font-size: .84rem; line-height: 1.8; color: var(--text); }
.c-k { color: #c084fc; } .c-f { color: var(--accent-2); } .c-s { color: #86efac; }

/* ---------- Seções ---------- */
.section { padding: 6rem 0; }
.section-alt { background: var(--bg-alt); border-block: 1px solid var(--border); }
.section-head { margin-bottom: 3rem; max-width: 720px; }
.section-tag { display: inline-block; font-family: var(--mono); font-size: .82rem; color: var(--accent-2); margin-bottom: .7rem; }
.section-head h2 { font-size: clamp(1.7rem, 3.6vw, 2.4rem); letter-spacing: -.01em; margin-bottom: .8rem; }
.section-sub { color: var(--muted); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.6rem; transition: transform .25s, border-color .25s, box-shadow .25s; }
.card:hover { transform: translateY(-4px); border-color: rgba(59,130,246,.5); box-shadow: var(--shadow); }
.card h3 { font-size: 1.15rem; margin-bottom: .35rem; }

/* Sobre */
.about-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 3rem; align-items: start; }
.about-text p { color: var(--muted); font-size: 1.04rem; }
.about-text strong { color: var(--text); }
.facts { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .5rem 1.4rem; }
.facts li { padding: 1rem 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: .15rem; }
.facts li:last-child { border-bottom: 0; }
.fact-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-2); }
.fact-value { font-weight: 500; }

/* Linha do tempo */
.timeline { position: relative; display: grid; gap: 1.5rem; padding-left: 2rem; max-width: 760px; }
.timeline::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
.timeline-item { position: relative; }
.timeline-dot { position: absolute; left: -2rem; top: 1.7rem; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 3px solid var(--accent); }
.badge { display: inline-block; font-size: .72rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: .25rem .7rem; border-radius: 999px; background: var(--surface-2); color: var(--muted); margin-bottom: .8rem; }
.badge-live { background: var(--accent-soft); color: var(--accent-2); }
.badge-todo { background: rgba(250, 204, 21, .12); color: #facc15; }
.meta { color: var(--muted); font-size: .9rem; margin: .4rem 0 0; }

/* Habilidades */
.skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
.chips { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: 1.2rem; }
.chips li { font-size: .88rem; padding: .4rem .9rem; border-radius: 8px; background: var(--accent-soft); color: var(--accent-2); border: 1px solid rgba(59,130,246,.25); }
.chips-outline li { background: transparent; color: var(--muted); border: 1px dashed var(--border); }
.note { margin-top: 1.8rem; padding: 1rem 1.3rem; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; color: var(--muted); }
.note strong { color: var(--text); }

/* Projetos */
.projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 1.6rem; }
.project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform .25s, border-color .25s, box-shadow .25s; }
.project-card:hover { transform: translateY(-6px); border-color: rgba(59,130,246,.55); box-shadow: var(--shadow); }
.project-thumb { position: relative; aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; }
.project-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.project-card:hover .project-thumb img { transform: scale(1.04); }
.tag-float { position: absolute; top: .8rem; left: .8rem; font-size: .74rem; font-weight: 600; padding: .25rem .7rem; border-radius: 999px; background: rgba(10,15,30,.8); border: 1px solid var(--border); color: var(--accent-2); backdrop-filter: blur(6px); }
.project-body { padding: 1.4rem; display: flex; flex-direction: column; flex: 1; }
.status-row { margin-bottom: .6rem; }
.project-body h3 { font-size: 1.2rem; margin-bottom: .6rem; }
.project-desc { color: var(--muted); font-size: .95rem; }
.project-info { margin: .4rem 0 1.3rem; display: grid; gap: .7rem; }
.project-info dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-2); }
.project-info dd { margin: .1rem 0 0; font-size: .9rem; color: var(--muted); }
.todo { color: #facc15; font-family: var(--mono); font-size: .8rem; }
.project-links { margin-top: auto; display: flex; flex-wrap: wrap; gap: .6rem; }
.project-card-future { border-style: dashed; background: transparent; align-items: center; justify-content: center; text-align: center; min-height: 320px; }
.project-card-future:hover { transform: none; box-shadow: none; }
.future-inner { padding: 2rem 1.5rem; display: flex; flex-direction: column; align-items: center; gap: .6rem; }
.future-plus { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 1.8rem; color: var(--accent-2); background: var(--accent-soft); }
.future-inner h3 { font-size: 1.15rem; }
.future-inner p { color: var(--muted); font-size: .92rem; margin-bottom: .6rem; }

/* Galeria de capturas (card da GL Fit) */
button.project-thumb { display: block; width: 100%; padding: 0; border: 0; cursor: zoom-in; font: inherit; color: inherit; }
.thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; padding: .6rem .6rem 0; background: var(--surface); }
.thumb { padding: 0; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-2); cursor: pointer; aspect-ratio: 16 / 9; opacity: .65; transition: opacity .2s, border-color .2s; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb:hover { opacity: 1; }
.thumb.is-active { opacity: 1; border-color: var(--accent); }
.project-note { font-size: .82rem; color: var(--muted); border-left: 2px solid var(--border); padding-left: .7rem; margin: 0 0 1.2rem; }
.btn[hidden] { display: none; }

.lightbox { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; gap: 1rem; padding: 1.2rem; background: rgba(5, 8, 18, .92); backdrop-filter: blur(6px); }
.lightbox[hidden] { display: none; }
.lb-figure { margin: 0; max-width: min(1100px, 82vw); text-align: center; }
.lb-figure img { max-height: 78vh; width: auto; margin-inline: auto; border-radius: 10px; border: 1px solid var(--border); box-shadow: var(--shadow); }
.lb-figure figcaption { margin-top: .8rem; color: var(--muted); font-size: .9rem; }
.lb-close, .lb-nav { background: var(--surface); color: var(--text); border: 1px solid var(--border); cursor: pointer; border-radius: 999px; line-height: 1; transition: background .2s, border-color .2s; }
.lb-close:hover, .lb-nav:hover { background: var(--surface-2); border-color: var(--accent); }
.lb-close { position: absolute; top: 1rem; right: 1rem; width: 44px; height: 44px; font-size: 1.7rem; }
.lb-nav { flex: none; width: 46px; height: 46px; font-size: 2rem; padding-bottom: 4px; }
@media (max-width: 700px) {
  .lightbox { flex-wrap: wrap; align-content: center; }
  .lb-figure { order: -1; max-width: 100%; flex: 0 0 100%; }
  .lb-nav { order: 1; }
}

/* Objetivos */
.goals-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.3rem; }
.goal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.6rem; transition: border-color .25s, transform .25s; }
.goal:hover { border-color: rgba(59,130,246,.55); transform: translateY(-4px); }
.goal-n { font-family: var(--mono); font-size: .85rem; color: var(--accent-2); }
.goal h3 { font-size: 1.1rem; margin: .5rem 0; }
.goal p { color: var(--muted); font-size: .94rem; margin: 0; }

/* Contato */
.contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.3rem; }
.contact-card { display: flex; flex-direction: column; gap: .35rem; padding: 1.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); transition: transform .25s, border-color .25s, background .25s; overflow-wrap: anywhere; }
.contact-card:hover { transform: translateY(-4px); border-color: var(--accent); background: var(--surface-2); }
.contact-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-2); }
.contact-value { font-weight: 500; }

/* Footer */
.footer { padding: 2rem 0; border-top: 1px solid var(--border); color: var(--muted); font-size: .9rem; }
.footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.footer p { margin: 0; }
.to-top:hover { color: var(--accent-2); }

/* ---------- Animação de entrada ---------- */
.js .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
.js .reveal.visible { opacity: 1; transform: none; }

/* ---------- Responsividade ---------- */
@media (max-width: 960px) {
  .hero-grid { grid-template-columns: 1fr; gap: 2.5rem; }
  .hero { min-height: auto; }
  .about-grid { grid-template-columns: 1fr; gap: 2rem; }
}
@media (max-width: 820px) {
  .nav-toggle { display: block; }
  .nav-menu {
    position: fixed; top: var(--header-h); left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 0;
    background: rgba(10, 15, 30, 0.98); border-bottom: 1px solid var(--border);
    padding: .5rem 4%; max-height: 0; overflow: hidden; visibility: hidden;
    transition: max-height .35s ease, visibility .35s;
  }
  .nav-menu.open { max-height: 440px; visibility: visible; }
  .nav-link { display: block; padding: .95rem 0; border-bottom: 1px solid var(--border); }
  .nav-link.active::after { display: none; }
  .nav-cta { margin: .9rem 0; text-align: center; border-bottom: 1px solid var(--accent); }
}
@media (max-width: 700px) {
  .section { padding: 4.2rem 0; }
  .skills-grid { grid-template-columns: 1fr; }
  .hero-actions .btn { flex: 1 1 100%; }
  .footer-inner { flex-direction: column; text-align: center; }
}
@media (max-width: 380px) {
  .code-window code { font-size: .74rem; }
  .projects-grid { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .js .reveal { opacity: 1; transform: none; }
}
